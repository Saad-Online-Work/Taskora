<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Receipt — VYQORLUNE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
html { background:#f1f7ff; }
.rc-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 16px}
.rc-card{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:36px 32px;box-shadow:0 30px 60px -30px rgba(15,23,42,.35)}
.rc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.rc-brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.rc-brand .brand-mark{width:28px;height:28px}
.rc-badge{display:inline-block;padding:4px 10px;border-radius:99px;background:#fef3c7;color:#b45309;
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid #fcd34d}
.rc-banner{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:11px 14px;
  font-size:13px;font-weight:600;margin:14px 0 18px}
.rc-table{width:100%;border-collapse:collapse}
.rc-table th,.rc-table td{text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.rc-table th{width:42%;color:var(--slate-500);font-weight:600}
.rc-table td{color:var(--ink);font-weight:600;word-break:break-word}
.rc-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.rc-status{font-size:12.5px;color:var(--slate-500);min-height:18px;margin-top:10px}
.rc-status.error{color:#b91c1c}
.rc-empty{text-align:center;padding:20px 0}
@media print{
  body{background:#fff}
  .rc-actions,.rc-status,.rc-head a{display:none!important}
  .rc-card{box-shadow:none;border:none}
}
</style>
</head>
<body>
<div class="rc-wrap">
  <div class="rc-card" id="rcCard">
    <div class="rc-head">
      <a href="app.html#settings" class="rc-brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        VYQORLUNE
      </a>
      <span class="rc-badge">Test mode · demo</span>
    </div>
    <h2 style="margin-bottom:4px">Payment receipt</h2>
    <p style="color:var(--slate-500);font-size:14px">Saved in this browser. No real payment was processed.</p>
    <div class="rc-banner">TEST MODE / DEMO: no real money was charged.</div>
    <div id="rcBody"></div>
    <div class="rc-actions" id="rcActions" hidden>
      <button type="button" class="btn btn-primary btn-block" id="rcPdfBtn">Download PDF receipt</button>
      <button type="button" class="btn btn-ghost btn-block" id="rcPrintBtn">Print / save as PDF</button>
      <a href="app.html#settings" class="btn btn-ghost btn-block">Back to Settings</a>
    </div>
    <div class="rc-status" id="rcStatus" aria-live="polite"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="js/vendor/pdf-lib.min.js"></script>
<script src="js/payment-test.js"></script>
<script>
(function(){
  'use strict';
  const user = TK.getUser();
  if (!user){
    location.replace('signin.html?next=' + encodeURIComponent('receipt.html' + location.search));
    return;
  }
  const id = new URLSearchParams(location.search).get('id') || '';
  const txn = VYQ_DEMO.getWallet(user.email).transactions.find(t => t.id === id);
  const body = document.getElementById('rcBody');
  const status = document.getElementById('rcStatus');

  if (!txn){
    body.innerHTML = `<div class="rc-empty"><h3>Receipt not found</h3>
      <p style="color:var(--slate-500);font-size:14px;margin-top:6px">No test transaction with this ID exists for your account in this browser.</p></div>`;
    return;
  }

  body.innerHTML = '<table class="rc-table">' + VYQ_DEMO.receiptRows(txn).map(([k, v]) =>
    `<tr><th>${TK.escapeHtml(k)}</th><td>${TK.escapeHtml(v)}</td></tr>`).join('') + '</table>';
  document.getElementById('rcActions').hidden = false;

  document.getElementById('rcPdfBtn').addEventListener('click', async () => {
    status.classList.remove('error');
    try {
      const blob = await VYQ_DEMO.buildReceiptPdf(txn);
      VYQ_DEMO.downloadBlob(blob, 'vyqorlune-TEST-receipt-' + txn.id + '.pdf');
      status.textContent = 'PDF receipt downloaded.';
    } catch (err){
      status.classList.add('error');
      status.textContent = 'Could not create the PDF: ' + err.message;
    }
  });
  document.getElementById('rcPrintBtn').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
