<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — VYQORLUNE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
html { background:#f1f7ff; }
.auth-logo{display:flex;justify-content:center;margin-bottom:26px;text-decoration:none}
.auth-logo .brand-mark-lg{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 16px 32px -10px rgba(37,99,235,.7);
}
.auth-logo .brand-mark-lg svg{width:32px;height:32px}
.auth-banner{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.5}
.auth-banner.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.auth-banner.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card" id="authCard"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
(function(){
  'use strict';

  const card = document.getElementById('authCard');
  card.innerHTML = `
    <a href="index.html" class="auth-logo" aria-label="Home">
      <span class="brand-mark-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
    <h2>Reset your password</h2>
    <p class="lead">Enter your account email and we'll send you a link to choose a new password.</p>
    <div class="auth-banner" id="authBanner" role="status" hidden></div>
    <form id="resetForm" novalidate>
      <div class="form-group">
        <label>Email Address <span class="req">*</span></label>
        <input name="email" type="email" required placeholder="you@example.com" autocomplete="email">
        <div class="form-error" data-error="email">Please enter a valid email.</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send Reset Link</button>
      </div>
    </form>
    <div class="auth-divider">or</div>
    <div class="auth-alt"><a href="signin.html">← Back to sign in</a></div>`;

  const banner = document.getElementById('authBanner');
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    banner.hidden = true;
    const email = (new FormData(form).get('email') || '').trim();
    const err = form.querySelector('[data-error="email"]');
    err.classList.remove('show');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.classList.add('show'); return; }

    if (!window.VYQ_AUTH.isConfigured()){
      banner.textContent = 'Backend is not configured yet. Add your Supabase URL and anon key to js/supabase-config.js.';
      banner.className = 'auth-banner error'; banner.hidden = false;
      return;
    }

    btn.classList.add('loading'); btn.disabled = true;
    try {
      await window.VYQ_AUTH.requestPasswordReset({
        email,
        redirectTo: new URL('reset-password.html', location.href).href
      });
      /* Same message whether or not the account exists — avoids account enumeration. */
      banner.textContent = 'If an account exists for ' + email + ', a reset link is on its way. Check your inbox and spam folder.';
      banner.className = 'auth-banner success'; banner.hidden = false;
    } catch (ex){
      banner.textContent = window.VYQ_AUTH.friendlyError(ex);
      banner.className = 'auth-banner error'; banner.hidden = false;
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
