<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose New Password — VYQORLUNE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
html { background:#f1f7ff; }
.auth-logo{display:flex;justify-content:center;margin-bottom:26px;text-decoration:none}
.auth-logo .brand-mark-lg{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 16px 32px -10px rgba(37,99,235,.7);
}
.auth-logo .brand-mark-lg svg{width:32px;height:32px}
.auth-banner{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.5}
.auth-banner.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.auth-banner.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.password-wrap{position:relative}
.password-wrap input{padding-right:44px !important}
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card" id="authCard">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <span class="brand-mark-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
    <h2>Choose a new password</h2>
    <p class="lead" id="leadText">Checking your reset link…</p>
    <div class="auth-banner" id="authBanner" role="alert" hidden></div>
    <form id="newPasswordForm" novalidate hidden>
      <div class="form-group">
        <label>New Password <span class="req">*</span></label>
        <input name="password" type="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
        <div class="form-error" data-error="password">Password must be at least 8 characters.</div>
      </div>
      <div class="form-group">
        <label>Confirm New Password <span class="req">*</span></label>
        <input name="confirm" type="password" required placeholder="Repeat password" autocomplete="new-password">
        <div class="form-error" data-error="confirm">Passwords do not match.</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update Password</button>
      </div>
    </form>
    <div class="auth-alt" style="margin-top:16px"><a href="signin.html">← Back to sign in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
(function(){
  'use strict';

  const lead = document.getElementById('leadText');
  const banner = document.getElementById('authBanner');
  const form = document.getElementById('newPasswordForm');
  const btn = document.getElementById('submitBtn');
  const showBanner = (msg, type) => {
    banner.textContent = msg; banner.className = 'auth-banner ' + (type || 'error'); banner.hidden = false;
  };

  if (!window.VYQ_AUTH.isConfigured()){
    lead.textContent = 'Backend is not configured yet.';
    showBanner('Add your Supabase URL and anon key to js/supabase-config.js.', 'error');
    return;
  }

  /* Only a PASSWORD_RECOVERY session may change the password here.
     The Supabase client exchanges the link's code (PKCE) on load and emits this event. */
  let recoveryReady = false;
  const unsubscribe = window.VYQ_AUTH.onAuthChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session && !recoveryReady && location.hash.includes('type=recovery'))) {
      recoveryReady = true;
      lead.textContent = 'Enter a new password for your account.';
      form.hidden = false;
    }
  });

  /* If the page was opened without a recovery session, say so instead of showing a dead form. */
  window.VYQ_AUTH.getSession().then(s => {
    setTimeout(() => {
      if (!recoveryReady && !s){
        lead.textContent = 'This reset link is invalid or has expired.';
        showBanner('Request a new link from the Forgot password page.', 'error');
      }
    }, 1200);
  }).catch(() => {});

  form.addEventListener('submit', async e => {
    e.preventDefault();
    banner.hidden = true;
    const fd = new FormData(form);
    const password = fd.get('password') || '';
    const confirm = fd.get('confirm') || '';
    const errP = form.querySelector('[data-error="password"]');
    const errC = form.querySelector('[data-error="confirm"]');
    errP.classList.remove('show'); errC.classList.remove('show');
    let ok = true;
    if (password.length < 8){ errP.classList.add('show'); ok = false; }
    if (password !== confirm){ errC.classList.add('show'); ok = false; }
    if (!ok) return;

    btn.classList.add('loading'); btn.disabled = true;
    try {
      await window.VYQ_AUTH.updatePassword(password);
      unsubscribe();
      form.hidden = true;
      lead.textContent = 'Your password has been updated.';
      showBanner('You can now sign in with your new password.', 'success');
    } catch (ex){
      showBanner(window.VYQ_AUTH.friendlyError(ex), 'error');
      btn.classList.remove('loading'); btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
