<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Taskora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card" id="authCard"></div>
</div>

<script src="app.js"></script>
<script>
(function(){
  'use strict';

  const user = TK.getUser();
  const card = document.getElementById('authCard');

  if (!user){
    card.innerHTML = `
      <a href="index.html" class="auth-brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        Taskora
      </a>
      <h2>No account found</h2>
      <p class="lead">You need to create an account first.</p>
      <div class="form-actions">
        <a href="signup.html" class="btn btn-primary btn-block">Create Account</a>
        <a href="index.html" class="btn btn-ghost btn-block">Back to Home</a>
      </div>`;
    return;
  }

  card.innerHTML = `
    <a href="index.html" class="auth-brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      Taskora
    </a>
    <h2>Welcome back</h2>
    <p class="lead">Sign in to access your workspace.</p>
    <form id="signinForm" novalidate>
      <div class="form-group">
        <label>Email Address <span class="req">*</span></label>
        <input name="email" type="email" required value="${TK.escapeHtml(user.email)}" autocomplete="email">
        <div class="form-error" data-error="email">Email does not match our records.</div>
      </div>
      <div class="form-group">
        <label>Password <span class="req">*</span></label>
        <input name="password" type="password" required placeholder="Your password" autocomplete="current-password">
        <div class="form-error" data-error="password">Incorrect password.</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign In</button>
      </div>
    </form>
    <div class="auth-divider">or</div>
    <div class="auth-alt">New here? <a href="signup.html">Create an account</a></div>
    <div class="auth-alt" style="margin-top:8px"><a href="index.html" style="color:var(--slate-500);font-weight:500">← Back to home</a></div>`;

  const form = document.getElementById('signinForm');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const email = (fd.get('email') || '').trim();
    const password = fd.get('password') || '';
    const errors = {
      email: form.querySelector('[data-error="email"]'),
      password: form.querySelector('[data-error="password"]')
    };
    Object.values(errors).forEach(el => el.classList.remove('show'));
    let ok = true;
    if (user.email !== email){ errors.email.classList.add('show'); ok = false; }
    if (user.passwordHash !== btoa(password)){ errors.password.classList.add('show'); ok = false; }
    if (!ok) return;

    btn.classList.add('loading'); btn.disabled = true;
    setTimeout(() => {
      TK.toast('Signed in. Welcome back!', 'success');
      window.location.replace('app.html');
    }, 700);
  });
})();
</script>
</body>
</html>
